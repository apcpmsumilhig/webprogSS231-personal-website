<html>
    <head>
        <link rel="stylesheet" href = "css/format.css">
        <title>gallery</title>
    </head>
    <body>
<!-- Slideshow container -->
<div class="slideshow-container">

    <!-- Full-width images with number and caption text -->
    <div class="mySlides fade">
        <div class="numbertext">1 / 3</div>
        <img src="css/assets/4.JPG" alt="Image 1">
        <div class="text">Me and My Friends Meeting up</div>
    </div>

    <div class="mySlides fade">
        <div class="numbertext">2 / 3</div>
        <img src="css/assets/11.png" alt="Image 2">
        <div class="text">A cat I found in the APC Parking Space</div>
    </div>

    <div class="mySlides fade">
        <div class="numbertext">3 / 3</div>
        <img src="css/assets/5.JPG" alt="Image 3">
        <div class="text">A piece I found in the National Museum of Anthropology</div>
    </div>

    <!-- Next and previous buttons -->
    <a class="prev" onclick="plusSlides(-1)">&#10094;</a>
    <a class="next" onclick="plusSlides(1)">&#10095;</a>
</div>
<br>

<!-- The dots/circles -->
<div style="text-align:center">
    <span class="dot" onclick="currentSlide(1)"></span>
    <span class="dot" onclick="currentSlide(2)"></span>
    <span class="dot" onclick="currentSlide(3)"></span>
</div>

<script src="js/slideshow.js"></script>
    </body>
</html>
